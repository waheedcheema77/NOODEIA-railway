[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip"]

[variables]
NIXPACKS_NODE_VERSION = "20"

[phases.build]
cmds = ["cd frontend && npm install && npm run build && python3 -m pip install -r requirements.txt --break-system-packages"]

[start]
cmd = "cd frontend && npm start"
