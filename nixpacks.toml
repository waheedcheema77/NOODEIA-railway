[phases.setup]
nixpkgsArchive = "b134951a4c9f3c995fd7be05f3243f8ecd65d798"
nixPkgs = ["nodejs_22", "python311", "python311Packages.pip"]

[phases.install]
cmds = [
    "cd frontend && npm install --legacy-peer-deps",
    "pip install --break-system-packages -t /app/vendor -r frontend/requirements.txt"
]

[phases.build]
cmds = ["cd frontend && NODE_OPTIONS='--max-old-space-size=8192' npm run build"]

# 🔥 THE FIX: Declare variables in the designated block so BOTH Node and Python see them!
[variables]
PYTHONPATH = "/app/vendor"
PYTHON_PATH = "python3"

[start]
cmd = "cd frontend && npm start"
