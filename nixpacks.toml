providers = ["node", "python"]

[variables]
NIXPACKS_NODE_VERSION = "20"

[phases.build]
cmds = ["cd frontend && npm install && npm run build && curl -sS https://bootstrap.pypa.io/get-pip.py | python3 --break-system-packages && python3 -m pip install -r requirements.txt --break-system-packages"]

[start]
cmd = "cd frontend && npm start"
