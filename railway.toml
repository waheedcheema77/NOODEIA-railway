[build]
builder = "NIXPACKS"
buildCommand = "cd frontend && npm install && npm run build && curl -sS https://bootstrap.pypa.io/get-pip.py | python3 --break-system-packages && python3 -m pip install -r requirements.txt --break-system-packages"

[deploy]
startCommand = "cd frontend && npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
PORT = "3000"
